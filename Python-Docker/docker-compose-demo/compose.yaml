services:

  api:

    build: .

    container_name: fastapi-api

    ports:
      - "8000:6677"

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/studentdb

    depends_on:
      - db


  db:

    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: studentdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:

  postgres_data: